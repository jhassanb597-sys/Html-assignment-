<html>
  <head><title>Html Form</title></head>
  <body bgcolor="aqua">

    <h1 align="center">Form</h1>
    <p align="center">Contact Us</p>
    <hr width="50%" align="center">

    <form align="center">

      <b>Username:</b><br>
      <input type="text" name="username" placeholder="Type your name" size="30">
      <br><br>

      <b>Password:</b><br>
      <input type="password" name="pass" placeholder="Your password" size="30">
      <br><br>

      <b>Comments:</b><br>
      <textarea name="complete" rows="4" cols="30" placeholder="Write your comments here..."></textarea>
      <br><br>

      <b>Gender:</b><br>
      <input type="radio" name="Gender" value="male"> Male
      <br>
      <input type="radio" name="Gender" value="female"> Female
      <br><br>

      <b>Interests:</b><br>
      <input type="checkbox" name="Interests" value="Coding"> Coding
      <br>
      <input type="checkbox" name="Interests" value="Gaming"> Gaming
      <br><br>

      <b>City:</b><br>
      <select name="City">
        <option value="">-- Select City --</option>
        <option value="khi">Karachi</option>
        <option value="gwdr">Gawader</option>
        <option value="qta">Quetta</option>
      </select>
      <br><br>

      <input type="submit" value="Send Us">
      &nbsp;&nbsp;
      <input type="reset" value="Clear">

    </form>

    <hr width="50%" align="center">

  </body>
</html>
